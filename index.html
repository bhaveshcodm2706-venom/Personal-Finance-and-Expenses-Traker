<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Finance and Expense Traker</title>
  
  <link rel="stylesheet" href="styles.css">

</head>
<body>
  <div class="container">

    <header>
        <h1>💰 Personal Finance & Expense Tracker</h1>
        <p>Track your income, expenses and balance</p>
    </header>


    <!-- Dashboard -->

    <div class="dashboard">

        <div class="card income">
            <h3>Total Income</h3>
            <h2 id="totalIncome">₹0.00</h2>
        </div>

        <div class="card expense">
            <h3>Total Expenses</h3>
            <h2 id="totalExpense">₹0.00</h2>
        </div>

        <div class="card balance">
            <h3>Current Balance</h3>
            <h2 id="currentBalance">₹0.00</h2>
        </div>

    </div>


    <!-- Add Transaction -->

    <div class="form-card">

        <h2>Add Transaction</h2>

        <form id="transactionForm">

            <div class="form-row">

                <div class="form-group">

                    <label>Type</label>

                    <select id="type" required>

                        <option value="expense">
                            Expense
                        </option>

                        <option value="income">
                            Income
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Title</label>

                    <input
                        type="text"
                        id="title"
                        placeholder="Example: Grocery"
                        required
                    >

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>Amount</label>

                    <input
                        type="number"
                        id="amount"
                        placeholder="Enter amount"
                        min="1"
                        step="0.01"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Category</label>

                    <select id="category"required>

                        <option value="Food">
                            Food
                        </option>

                        <option value="Travel">
                            Travel
                        </option>

                        <option value="Shopping">
                            Shopping
                        </option>

                        <option value="Education">
                            Education
                        </option>

                        <option value="Bills">
                            Bills
                        </option>

                        <option value="Entertainment">
                            Entertainment
                        </option>

                        <option value="Salary">
                            Salary
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>Date</label>

                    <input
                        type="date"
                        id="date"
                        required
                    >

                </div>

                <div class="form-group button-container">

                    <button type="submit">
                        + Add Transaction
                    </button>

                </div>

            </div>

        </form>

    </div>


    <!-- Transaction History -->

<div class="table-card">
    <div class="table-header">
        <h2>Transaction History</h2> 
        <button
        type="button"
        id="refreshButton"
        class="refresh-btn">
        Refresh
    </button>
</div>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>Date</th>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Type</th>
                        <th>Amount</th>
                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="transactionTable">

                </tbody>

            </table>

        </div>

    </div>

</div>


<script type="module" src="/src/script.js"></script>

</body>
</html>
